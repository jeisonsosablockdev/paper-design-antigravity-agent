<section class="dating-screen" style="display: flex; flex-direction: column; width: 390px; height: fit-content; background: #0A0A0C; color: #FFFFFF; font-family: Inter, sans-serif;">
  <header style="display: flex; align-items: center; justify-content: space-between; padding: 16px 20px;">
    <span style="font-weight: 700; font-size: 20px;">Flame</span>
    <div  class="avatar" style="flex-shrink: 0; width: 36px; height: 36px; border-radius: 50%; background: #333;"></div>
  </header>
  <main style="flex: 1; padding: 10px 20px; display: flex; flex-direction: column;">
    <div class="card" style="flex: 1; border-radius: 20px; background: #18181B; position: relative; overflow: hidden;">
      <div style="position: absolute; bottom: 0; left: 0; right: 0; padding: 20px; background: linear-gradient(transparent, rgba(0,0,0,0.85));">
        <h2 style="font-size: 24px; margin: 0;">Elena, 26</h2>
        <p style="font-size: 14px; color: #A1A1AA; margin: 4px 0 12px;">Diseñadora UI · San Francisco</p>
      </div>
    </div>
  </main>
  <footer style="display: flex; justify-content: center; gap: 20px; padding: 16px 20px 24px;">
    <button  style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%; border: 1px solid #333; background: #141416; color: #EF4444; font-size: 20px;">✕</button>
    <button  style="flex-shrink: 0; width: 56px; height: 56px; border-radius: 50%; border: none; background: #EC4899; color: #FFFFFF; font-size: 20px;">♥</button>
  </footer>
</section>
